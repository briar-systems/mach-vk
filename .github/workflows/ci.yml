name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  generate:
    name: Generation drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated sources against the registry
        run: python3 tools/gen.py check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Sync dependencies
        run: mach dep pull

      # the binding links nothing: no Vulkan loader, no ICD, no display.
      - name: Test
        run: mach test .

  targets:
    name: Cross-target build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x86_64, windows-x86_64, darwin-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Sync dependencies
        run: mach dep pull

      # the declarations are platform-agnostic, so every target builds the same
      # surface; this proves it rather than assuming it.
      - name: Build ${{ matrix.target }}
        run: mach build . --target ${{ matrix.target }} --profile release

  smoke:
    name: Vulkan smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a Vulkan loader and the lavapipe software ICD
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Sync dependencies
        working-directory: test/smoke
        run: mach dep pull

      # a separate project precisely so the binding's own test run stays
      # link-free; this one links the loader and drives a live ICD through
      # instance, physical devices, device, and queue.
      - name: Smoke test
        run: |
          set -euo pipefail
          mach build test/smoke
          mach run test/smoke

  windows-smoke:
    name: Windows loader verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # linking records the vulkan-1.dll dependency by name with no on-disk
      # probe, so the SDK is unneeded; only the loader itself must be present
      # at run time, which the runtime-only installer provides
      - name: Install Vulkan loader
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Windows\System32\vulkan-1.dll")) {
            $installer = Join-Path $env:RUNNER_TEMP "vulkan-runtime.exe"
            curl.exe -fsSL "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime.exe" -o $installer
            Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          }
          if (-not (Test-Path "C:\Windows\System32\vulkan-1.dll")) {
            Write-Error "vulkan-1.dll not present after runtime install"
            exit 1
          }
          Write-Host "vulkan-1.dll present"

      - name: Fetch released mach
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = Join-Path $env:RUNNER_TEMP 'machdl'
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Path $dl, $bin -Force | Out-Null
          gh release download -R briar-systems/mach -p 'mach-*-x86_64-windows.zip' -D $dl --clobber
          $zip = Get-ChildItem -Path $dl -Filter 'mach-*-x86_64-windows.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath $dl -Force
          $mach = Get-ChildItem -Path $dl -Filter 'mach.exe' -Recurse | Select-Object -First 1
          Copy-Item $mach.FullName (Join-Path $bin 'mach.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Sync dependencies
        shell: bash
        working-directory: test/smoke
        run: mach dep pull

      - name: Build smoke test
        shell: bash
        run: mach build test/smoke --target windows-x86_64 --profile release

      # a headless runner has the loader but no ICD, so the full test fails at
      # vkCreateInstance; fall back to link-only, which still proves the loader
      # loads and the vkGetInstanceProcAddr chain resolves
      - name: Run smoke test
        shell: bash
        run: |
          set -euo pipefail
          mach run test/smoke --target windows-x86_64 --profile release || {
            echo "full smoke test failed (no ICD on CI), falling back to link-only"
            VKSMOKE_LINK_ONLY=1 mach run test/smoke --target windows-x86_64 --profile release
          }

  darwin-smoke:
    name: Darwin loader verification
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install MoltenVK
        run: |
          set -euo pipefail
          brew install molten-vk
          # verify the dylib is findable
          ls -la /usr/local/lib/libMoltenVK.dylib

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/machdl" "$RUNNER_TEMP/bin"
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-darwin.tar.gz' -D "$RUNNER_TEMP/machdl" --clobber
          tar -xzf "$RUNNER_TEMP"/machdl/mach-*-x86_64-darwin.tar.gz -C "$RUNNER_TEMP/machdl"
          install -m 0755 "$RUNNER_TEMP/machdl/mach" "$RUNNER_TEMP/bin/mach"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        working-directory: test/smoke
        run: mach dep pull

      - name: Build smoke test
        run: mach build test/smoke --target darwin-x86_64 --profile release

      # try the full smoke test first (needs a GPU via MoltenVK); fall back to
      # link-only when the CI runner has no GPU available
      - name: Run smoke test
        run: |
          set -euo pipefail
          mach run test/smoke --target darwin-x86_64 --profile release || {
            echo "full smoke test failed (likely no GPU), falling back to link-only"
            VKSMOKE_LINK_ONLY=1 mach run test/smoke --target darwin-x86_64 --profile release
          }
