[project]
id = "vk"
version = "0.8.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[profile.debug]
optimize = false
debug = true
simd = "scalarize"
default = true

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.vk]
kind = "static"
entry = "lib/vk.mach"
out = "{project.work}/lib/libvk{artifact.suffix}"
targets = ["*"]
link = []
need = []
default = true

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
