[project]
id      = "vksmoke"
version = "0.1.0"
src     = "src"
out     = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt   = 0
debug = true
simd  = "scalarize"

[profile.release]
opt   = 2
debug = false
simd  = "scalarize"

[artifact.vksmoke]
kind    = "bin"
entry   = "main.mach"
out     = "bin/vksmoke"
targets = ["*"]
link    = ["vulkan-linux", "vulkan-windows", "vulkan-darwin"]
need    = []

[link.vulkan-linux]
source  = "system"
name    = "vulkan"
library = "vulkan"
os      = "linux"
isa     = "*"
abi     = "*"
export  = false

[link.vulkan-windows]
source  = "system"
name    = "vulkan-1.dll"
library = "vulkan"
os      = "windows"
isa     = "*"
abi     = "*"
export  = false

[link.vulkan-darwin]
source  = "system"
name    = "MoltenVK"
library = "vulkan"
os      = "darwin"
isa     = "*"
abi     = "*"
export  = false

[dep.mach-vk]
path = "../.."

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
