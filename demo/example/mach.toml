[project]
id = "example"
version = "0.1.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[profile.debug]
optimize = false
debug = true
simd = "scalarize"
default = true

[profile.release]
optimize = true
debug = false
simd = "scalarize"

# the worked example, and the only thing here that links a real loader
[artifact.example]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/example{artifact.suffix}"
targets = ["*"]
link = ["vulkan-linux", "vulkan-windows", "vulkan-darwin"]
need = []

# the loader is named per platform and resolved by the system at run time. a
# linux build finds the shared library on the build host, so it needs the loader
# installed for the target's architecture
[link.vulkan-linux]
source  = "system"
name    = "vulkan"
sys     = ["linux"]
arch    = ["*"]
abi     = ["*"]
export  = false

[link.vulkan-windows]
source  = "system"
name    = "vulkan-1.dll"
sys     = ["windows"]
arch    = ["*"]
abi     = ["*"]
export  = false

[link.vulkan-darwin]
source  = "system"
name    = "@rpath/libMoltenVK.dylib"
sys     = ["darwin"]
arch    = ["*"]
abi     = ["*"]
export  = false

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

# the bindings from this checkout, so the example always drives the tree it ships with
[dep.vk]
path = "../.."
